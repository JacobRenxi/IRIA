<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hub</title>
<style>
  :root {
    --paper: #EEF2F5;
    --ink: #15233A;
    --muted: #5B6B80;
    --rule: #C9D3DE;
    --signal: #C98A00;
    --error: #B3261E;
    --surface: #FFFFFF;
    --sans: "IBM Plex Sans", "Segoe UI", Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #18212E; --ink: #E3E9F0; --muted: #9AA8B8; --rule: #33414F; --surface: #202B3A; --signal: #E0A82E; --error: #F2867D; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
           padding: .9rem max(1rem, calc((100% - 46rem) / 2)); border-bottom: 1px solid var(--rule); }
  header h1 { font-size: 1.15rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: .4rem .9rem; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  main { flex: 1; overflow-y: auto; padding: 1.5rem max(1rem, calc((100% - 46rem) / 2)) 2rem; }
  .empty { color: var(--muted); max-width: 34rem; margin-top: 18vh; }
  .empty strong { color: var(--ink); display: block; font-size: 1.35rem; font-weight: 600; margin-bottom: .35rem; }

  .turn { margin-bottom: 2.25rem; }
  .ask { font-weight: 600; font-size: 1.05rem; padding-left: .85rem; border-left: 3px solid var(--ink); white-space: pre-wrap; }
  /* The tool trail: an audit line for every system the hub touched */
  .trail { list-style: none; margin: .7rem 0 0 .85rem; padding: 0; font-size: .85rem; color: var(--muted); }
  .trail li { position: relative; padding-left: 1.1rem; margin: .2rem 0; overflow-wrap: anywhere; }
  .trail li::before { content: ""; position: absolute; left: 0; top: .55em; width: .45rem; height: .45rem; border-radius: 50%; background: var(--signal); }
  .trail .sys { color: var(--ink); font-weight: 600; }
  .trail code { font: .8rem var(--mono); }
  .answer { margin: .9rem 0 0 .85rem; }
  .answer .md { white-space: pre-wrap; max-width: 44rem; }
  .answer pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: .75rem .9rem; overflow-x: auto; font: .85rem/1.45 var(--mono); }
  .answer code { font-family: var(--mono); font-size: .9em; }
  .working { margin: .9rem 0 0 .85rem; color: var(--muted); }
  .error { margin: .9rem 0 0 .85rem; color: var(--error); }

  form { border-top: 1px solid var(--rule); padding: .9rem max(1rem, calc((100% - 46rem) / 2)) 1.1rem; display: flex; gap: .6rem; align-items: flex-end; background: var(--paper); }
  textarea { flex: 1; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .75rem; resize: none; min-height: 2.8rem; max-height: 12rem; }
  textarea:focus-visible { outline-offset: 0; }
  form button[type=submit] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <header>
    <h1>AI Hub</h1>
    <p>Answers from your connected systems</p>
    <button id="new-chat" type="button">New chat</button>
  </header>
  <main id="log" aria-live="polite">
    <div class="empty" id="empty">
      <strong>Ask about your systems</strong>
      The hub queries Elasticsearch and every connected MCP server, and lists each tool it uses under your question.
    </div>
  </main>
  <form id="composer">
    <label class="sr-only" for="input">Message</label>
    <textarea id="input" rows="1" placeholder="Which hosts had the most failed logins in the last 24 hours?" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
